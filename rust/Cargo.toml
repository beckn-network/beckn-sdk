[package]
name = "beckn-sdk"
version = "1.0.0"
edition = "2021"
description = "BeckN Protocol SDK for Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }


[features]
default = ["sync"]
sync = []
